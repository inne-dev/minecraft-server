services:
  minecraft-server:
    image: itzg/minecraft-server:java21
    container_name: minecraft-server
    ports:
      - 25565:25565
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.11"
      MEMORY: "2G"
      TZ: "Europe/Moscow"
      ONLINE_MODE: "FALSE"
      ENABLE_WHITELIST: "TRUE"
    volumes:
      - ./data:/data
    restart: unless-stopped

