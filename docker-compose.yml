services:
  minecraft-server:
    image: itzg/minecraft-server:java25
    container_name: minecraft-server
    ports:
      - 25565:25565
      - 24454:24454/udp
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.1.2"
      MEMORY: "4G"
      TZ: "Europe/Moscow"
      ONLINE_MODE: "FALSE"
      ENABLE_WHITELIST: "TRUE"
    volumes:
      - ./data:/data
    restart: unless-stopped
