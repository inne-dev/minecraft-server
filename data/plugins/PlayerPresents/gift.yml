# ========== DYNAMIC PRICING ==========
# Configure how much gifts cost
Cost:
  # Price type: "dynamic" or "static"
  # - dynamic: price = base-price + (number of slots * price-per-slot)
  # - static: price is set individually for each slot count
  type: "dynamic"

  # Dynamic pricing based on number of slots
  # Formula: base-price + (slots * price-per-slot)
  # Example: 1 slot = 150 + (1 * 75) = 225 currency units
  dynamic-gift-cost:
    base-price: 150.0
    price-per-slot: 75.0

  # Static pricing - set individual prices for each slot count
  # Use this if you want non-linear pricing
  static-gift-cost:
    price-slot1: 100.0
    price-slot2: 200.0
    price-slot3: 300.0
    price-slot4: 400.0
    price-slot5: 500.0
    price-slot6: 600.0
    price-slot7: 700.0
    price-slot8: 800.0
    price-slot9: 900.0
    price-slot10: 1000.0
    price-slot11: 1100.0
    price-slot12: 1200.0
    price-slot13: 1300.0
    price-slot14: 1400.0
    price-slot15: 1500.0
    price-slot16: 1600.0
    price-slot17: 1700.0
    price-slot18: 1800.0
    price-slot19: 1900.0
    price-slot20: 2000.0
    price-slot21: 2100.0
    price-slot22: 2200.0
    price-slot23: 2300.0
    price-slot24: 2400.0
    price-slot25: 2500.0
    price-slot26: 2600.0

