# Gift opening lock for the 2026-2027 New Year season.
language: "ru"
vault: false
gift-lock:
  mode: "scheduled"
  duration-minutes: 1
  scheduled-open-date: "2027-01-01 00:00:00"
  timezone: "Europe/Moscow"
logging:
  enabled: true

placeholders:
  from: "{from}"
  for: "{for}"

blacklist-items:
  - SHULKER_BOX
  - BLACK_SHULKER_BOX
  - BLUE_SHULKER_BOX
  - BROWN_SHULKER_BOX
  - CYAN_SHULKER_BOX
  - GRAY_SHULKER_BOX
  - GREEN_SHULKER_BOX
  - LIGHT_BLUE_SHULKER_BOX
  - LIGHT_GRAY_SHULKER_BOX
  - LIME_SHULKER_BOX
  - MAGENTA_SHULKER_BOX
  - ORANGE_SHULKER_BOX
  - PINK_SHULKER_BOX
  - PURPLE_SHULKER_BOX
  - RED_SHULKER_BOX
  - WHITE_SHULKER_BOX
  - YELLOW_SHULKER_BOX

inventory-full-action: "drop"

content-filter:
  enabled: true
  log-violations: true

gui:
  placeholder-item: "RED_STAINED_GLASS_PANE"
  placeholder-name: "§7Available Slot"
  confirm-button-item: "LIME_CONCRETE"
  confirm-button-name: "§a✓ Create Gift"
  confirm-button-lore:
    - "§7Click to create and give the gift"
  enable-custom-name-button: true
  enable-custom-lore-button: true

effects:
  create-sound: "ENTITY_PLAYER_LEVELUP"
  open-sound: "BLOCK_CHEST_OPEN"
  create-particle: "HAPPY_VILLAGER"
  open-particle: "FIREWORKS"
  create-particle-count: 25
  open-particle-count: 25
