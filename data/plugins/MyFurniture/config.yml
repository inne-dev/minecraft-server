checkVersionMsg: true
whitelistedWorlds: []
giveLimit: 100
silentGive: true
premiumEnableCooldownForOp: true

displayDefaultScale: 1.0
displayDefaultPitch: 90
displayDefaultTransform: NONE

selfHostPack: true # Set it to true to host the textures pack yourself
texturesPackUrl: '' # Set it to "" to disable
obfuscatePack: false # Set it to true to obfuscate resource pack file names (prevents easy extraction/reuse of custom models)
usePackSquash: false # Set it to true to optimize the pack with PackSquash (reduces size 30-60%, requires PackSquash installed)
packSquashPath: packsquash # Path to the PackSquash binary (or just "packsquash" if it's in your system PATH)
config_12_04_2024: true
maxFurniturePlacedUsingCommand: 500
downloadAndExtractAtNextRestart: false
